<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>直接复刻 · 凡哥工作台</title>
<style>
:root{
  --bg:#F2F4F7; --card:#FFFFFF; --line:#E9EDF2;
  --ink:#1A2238; --sub:#6B7790; --muted:#94A1B5;
  --blue:#4A90D9; --blueDeep:#2D6CCD; --blueSoft:#E9F2FC;
  --purple:#7B5EE3; --green:#3DB68A; --orange:#E89B45;
  --shadow:0 4px 16px rgba(28,40,68,.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;padding:0 0 120px;}
a{text-decoration:none;}
.wrap{max-width:560px;margin:0 auto;padding:14px;}
.topbar{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px;z-index:10;}
.topbar a.back{color:var(--blueDeep);font-size:14px;font-weight:600;}
.topbar .h{font-size:14px;font-weight:700;flex:1;}
.card{background:var(--card);border-radius:18px;padding:16px;margin-top:14px;box-shadow:var(--shadow);}
.pillartag{display:inline-block;font-size:11px;padding:3px 10px;border-radius:999px;font-weight:700;}
.t-emotion{background:rgba(74,144,217,.13);color:var(--blue);}
.t-cognition{background:rgba(123,94,227,.13);color:var(--purple);}
.t-daily{background:rgba(61,182,138,.13);color:var(--green);}
.t-interactive{background:rgba(232,155,69,.13);color:var(--orange);}
.title{font-size:20px;font-weight:800;line-height:1.3;margin:8px 0;}
.meta{font-size:12px;color:var(--sub);margin-top:6px;}
.summary{font-size:14px;line-height:1.6;color:var(--ink);margin-top:10px;}
.blk{margin-top:16px;}
.lab{font-size:12px;color:var(--blue);font-weight:700;letter-spacing:.5px;margin-bottom:8px;text-transform:uppercase;}
.tt{background:var(--bg);border-left:3px solid var(--blue);padding:10px 12px;border-radius:8px;margin-bottom:8px;font-size:15px;line-height:1.5;font-weight:600;}
.hook{background:var(--blueSoft);border-radius:12px;padding:12px;font-size:15px;line-height:1.6;}
.step{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start;}
.step .n{flex:0 0 24px;width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px;}
.step .s{font-size:15px;line-height:1.5;flex:1;}
.compliance{background:rgba(232,155,69,.1);border-left:3px solid var(--orange);padding:12px;border-radius:8px;font-size:14px;line-height:1.6;color:#9a6a1f;}
.actions{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:12px 14px;padding-bottom:calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;z-index:20;}
.btn{flex:1;text-align:center;background:var(--blue);color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;}
.btn.purple{background:var(--purple);}
.btn:active{transform:scale(.98);}
.btn.ghost{background:transparent;color:var(--sub);border:1px solid var(--line);}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(28,40,68,.92);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:80%;text-align:center;}
.toast.show{opacity:1;}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="mobile.html">← 回工作台</a>
    <div class="h">🚀 直接复刻</div>
  </div>
  <div id="content"><div class="empty">加载中…</div></div>
</div>
<div class="actions" id="actions" style="display:none">
  <a class="btn ghost" id="douyinBtn" href="#" target="_blank" rel="noopener">🔍 看原爆款</a>
  <button class="btn purple" onclick="copyScript()">📋 复制脚本</button>
</div>
<div class="toast" id="toast"></div>

<script src="workbench-data.js"></script>
<script>
const PILLAR_MAP = {
  emotion:{name:"情感成长",cls:"t-emotion"},
  cognition:{name:"认知观点",cls:"t-cognition"},
  daily:{name:"凡哥日常+轻AI",cls:"t-daily"},
  interactive:{name:"互动福利",cls:"t-interactive"}
};
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1600);}
function getParam(n){return new URLSearchParams(location.search).get(n);}
function buildScript(t){
  const rc=t.recreate;
  return `【凡哥风二创脚本】${t.title}\n支柱：${PILLAR_MAP[t.pillar].name}\n热度：${t.heat} · ${t.date}\n\n📌 标题（3选1）：\n${rc.title.map((x,i)=>`${i+1}. ${x}`).join("\n")}\n\n🎣 开头钩子：\n${rc.hook}\n\n🧱 正文结构：\n${rc.structure.map((s,i)=>`${i+1}. ${s}`).join("\n")}\n\n⚠️ 合规提醒：\n${rc.compliance}`;
}
function copyScript(){
  if(!window._cur) return;
  const txt=buildScript(window._cur);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast("脚本已复制，去写/去拍 ✓")).catch(()=>fallbackCopy(txt));
  } else fallbackCopy(txt);
}
function fallbackCopy(txt){
  const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");toast("脚本已复制 ✓");}catch(e){toast("复制失败，请手动选择");}
  document.body.removeChild(ta);
}
function init(){
  const id=getParam("id");
  const list=(window.WB_DATA&&window.WB_DATA.HOT_TOPICS)||[];
  const t=list.find(x=>x.id===id);
  if(!t){document.getElementById("content").innerHTML='<div class="empty">没找到这条热点。<br><br><a href="mobile.html" style="color:var(--blue)">← 回工作台看看</a></div>';return;}
  window._cur=t;
  const p=PILLAR_MAP[t.pillar];
  const rc=t.recreate;
  document.getElementById("content").innerHTML=`
    <div class="card">
      <span class="pillartag ${p.cls}">${p.name}</span>
      <div class="title">${t.title}</div>
      <div class="meta">🔥 ${t.heat} · ${t.date} · 为什么火：${t.whyHot}</div>
      <div class="summary">${t.summary}</div>
    </div>
    <div class="card">
      <div class="blk"><div class="lab">凡哥风标题（3选1）</div>${rc.title.map(x=>`<div class="tt">${x}</div>`).join("")}</div>
      <div class="blk"><div class="lab">开头钩子</div><div class="hook">${rc.hook}</div></div>
      <div class="blk"><div class="lab">正文结构</div>${rc.structure.map((s,i)=>`<div class="step"><div class="n">${i+1}</div><div class="s">${s}</div></div>`).join("")}</div>
      <div class="blk"><div class="lab">合规提醒</div><div class="compliance">${rc.compliance}</div></div>
    </div>`;
  document.getElementById("douyinBtn").href="https://www.douyin.com/search/"+encodeURIComponent(t.title);
  document.getElementById("actions").style.display="flex";
}
init();
</script>
</body>
</html>
